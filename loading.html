<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PoPs Suite</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2f1f6b;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  }
  .box { text-align: center; color: #fff; }
  .logo { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
  .logo span { color: #f5a623; }
  .status { margin-top: 10px; font-size: 12.5px; color: rgba(255,255,255,0.7); }
  .bar-track {
    margin-top: 18px; width: 220px; height: 4px;
    background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 40%; background: #f5a623; border-radius: 2px;
    animation: slide 1s ease-in-out infinite;
  }
  @keyframes slide {
    0% { margin-left: -40%; }
    100% { margin-left: 100%; }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">PoPs <span>Suite</span></div>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="status">Loading...</div>
  </div>
</body>
</html>
